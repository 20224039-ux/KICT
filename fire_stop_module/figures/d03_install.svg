<svg class="dwg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="설치 동작 3단계: 카세트를 12 mm 들어올려 텅을 포켓에 끼우고, 하단을 안으로 밀어 넣은 뒤, 12 mm 내려놓으면 상부 테일이 걸이레일에, 하부 리브가 스타터레일 리브 뒤에 동시에 걸린다"><style>svg.dwg{--sheet:#ffffff;--ink:#1d2329;--muted:#5f6973;--rule:#d6dbe1;--new:#c4511a;--new-tint:#fbe6da;--water:#1769c2;--bad:#b0124a;--ok:#2f7d4f;--core:#ece6d3;--core-dot:#b3a77f}@media (prefers-color-scheme:dark){svg.dwg{--sheet:#1b1f25;--ink:#e4e8ec;--muted:#9aa4ae;--rule:#333a43;--new:#f08043;--new-tint:#46281a;--water:#5aa9f6;--bad:#f0679a;--ok:#62c48e;--core:#343128;--core-dot:#71684f}}
.dwg{font-family:var(--f-body,'IBM Plex Sans KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif)}
.dwg .bg{fill:var(--sheet)}
.dwg .fl{stroke:none}
.dwg .sk{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:square}
.dwg .gt{fill:none;stroke:var(--muted);stroke-width:3}
