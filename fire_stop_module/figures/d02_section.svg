<svg class="dwg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 830" width="980" height="830" role="img" aria-label="추천안 수직 단면: 카세트의 텅이 기존 상부 외부강판 뒤 포켓에 70 mm 들어가고, 스커트가 스타터레일과 기존 하부 외부강판 바깥을 덮는다. 카세트는 상부 걸이레일과 스타터레일 리브에 걸리며, 미네랄울이 외부강판 면에서 내부강판까지 418 mm 높이로 채워진다"><style>svg.dwg{--sheet:#ffffff;--ink:#1d2329;--muted:#5f6973;--rule:#d6dbe1;--new:#c4511a;--new-tint:#fbe6da;--water:#1769c2;--bad:#b0124a;--ok:#2f7d4f;--core:#ece6d3;--core-dot:#b3a77f}@media (prefers-color-scheme:dark){svg.dwg{--sheet:#1b1f25;--ink:#e4e8ec;--muted:#9aa4ae;--rule:#333a43;--new:#f08043;--new-tint:#46281a;--water:#5aa9f6;--bad:#f0679a;--ok:#62c48e;--core:#343128;--core-dot:#71684f}}
.dwg{font-family:var(--f-body,'IBM Plex Sans KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif)}
.dwg .bg{fill:var(--sheet)}
.dwg .fl{stroke:none}
.dwg .sk{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:square}
