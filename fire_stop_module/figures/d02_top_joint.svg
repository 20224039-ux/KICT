<svg class="dwg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" role="img" aria-label="상부 조인트 확대 상세: 기존 외부강판과 단열재는 같은 선에서 잘린 그대로 두고, 그 아래에 캡레일을 붙인다. 캡레일 상판은 단열재 절단면에 밀착하고, 립은 기존 강판 면보다 0.5 mm 안쪽에서 90 mm 내려온다. 카세트 텅은 립 뒤 3 mm 등압 공간에서 70 mm 겹치며, 립 하단과 조글 사이 15 mm 줄눈으로 물이 빠진다"><style>svg.dwg{--sheet:#ffffff;--ink:#1d2329;--muted:#5f6973;--rule:#d6dbe1;--new:#c4511a;--new-tint:#fbe6da;--water:#1769c2;--bad:#b0124a;--ok:#2f7d4f;--core:#ece6d3;--core-dot:#b3a77f}@media (prefers-color-scheme:dark){svg.dwg{--sheet:#1b1f25;--ink:#e4e8ec;--muted:#9aa4ae;--rule:#333a43;--new:#f08043;--new-tint:#46281a;--water:#5aa9f6;--bad:#f0679a;--ok:#62c48e;--core:#343128;--core-dot:#71684f}}
.dwg{font-family:var(--f-body,'IBM Plex Sans KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif)}
.dwg .bg{fill:var(--sheet)}
.dwg .fl{stroke:none}
.dwg .sk{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:square}
.dwg .gt{fill:none;stroke:var(--muted);stroke-width:3}
.dwg .nw{fill:none;stroke:var(--new);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.dwg .nw2{fill:none;stroke:var(--new);stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.dwg .pc-bg{fill:var(--core)}
.dwg .pc-dot{fill:var(--core-dot)}
.dwg .pm-bg{fill:var(--new-tint)}
.dwg .pm-ln{fill:none;stroke:var(--new);stroke-width:.7;opacity:.7}
.dwg .ps-bg{fill:var(--sheet)}
.dwg .ps-ln{fill:none;stroke:var(--new);stroke-width:.6;opacity:.55}
.dwg .void{fill:var(--sheet);stroke:var(--muted);stroke-width:.8;stroke-dasharray:3 2}
.dwg .brk{fill:none;stroke:var(--muted);stroke-width:1}
.dwg .wt{fill:none;stroke:var(--water);stroke-width:1.6;stroke-dasharray:5 3}
.dwg .wt2{fill:none;stroke:var(--water);stroke-width:1.2;stroke-dasharray:3 2}
.dwg .lk{fill:none;stroke:var(--bad);stroke-width:1.6;stroke-dasharray:5 3}
.dwg .mv{fill:none;stroke:var(--ink);stroke-width:1.5}
.dwg .mk-w{fill:var(--water)}
.dwg .mk-k{fill:var(--ink)}
.dwg .mk-b{fill:var(--bad)}
.dwg .dm{fill:none;stroke:var(--muted);stroke-width:.8}
.dwg .dx{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.dwg .tx{fill:var(--ink);font-size:12px}
.dwg .ts{fill:var(--muted);font-size:11px}
.dwg .th{fill:var(--ink);font-size:13.5px;font-weight:700}
.dwg .tw{fill:var(--water);font-size:11.5px}
.dwg .tn{fill:var(--new);font-size:12px;font-weight:600}
.dwg .tb{fill:var(--bad);font-size:12px;font-weight:600}
.dwg .tk{fill:var(--ok);font-size:12px;font-weight:600}
.dwg .halo{paint-order:stroke;stroke:var(--sheet);stroke-width:3.5px;stroke-linejoin:round}
.dwg .bc{fill:var(--sheet);stroke:var(--new);stroke-width:1.2}
.dwg .bn{fill:var(--new);font-family:var(--f-mono,'IBM Plex Mono',ui-monospace,Menlo,monospace);font-size:10.5px;font-weight:600}
.dwg .ld{fill:none;stroke:var(--muted);stroke-width:.7}
.dwg .ldd{fill:var(--muted)}
.dwg .sc{fill:none;stroke:var(--ink);stroke-width:1.8}
.dwg .sl{fill:var(--bad)}
.dwg .hl{fill:none;stroke:var(--new);stroke-width:1.1;stroke-dasharray:2.5 2}
.dwg .jt{fill:none;stroke:var(--muted);stroke-width:.9;stroke-dasharray:3 2}
</style><defs><pattern id="d02-core" width="7" height="7" patternUnits="userSpaceOnUse"><rect class="pc-bg" width="7" height="7"/><circle class="pc-dot" cx="1.75" cy="1.75" r=".8"/><circle class="pc-dot" cx="5.25" cy="5.25" r=".8"/></pattern><pattern id="d02-mw" width="10" height="7" patternUnits="userSpaceOnUse"><rect class="pm-bg" width="10" height="7"/><polyline class="pm-ln" points="0,3.5 2.5,1 5,3.5 7.5,6 10,3.5"/></pattern><pattern id="d02-ms" width="12" height="9" patternUnits="userSpaceOnUse"><rect class="ps-bg" width="12" height="9"/><polyline class="ps-ln" points="0,4.5 3,1.5 6,4.5 9,7.5 12,4.5"/></pattern><marker id="d02-aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk-w" d="M0,0 L10,5 L0,10 z"/></marker><marker id="d02-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk-k" d="M0,0 L10,5 L0,10 z"/></marker><marker id="d02-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk-b" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" width="1000" height="800"/><polygon class="fl" points="345.0,60.0 705.0,60.0 705.0,247.2 345.0,247.2" fill="url(#d02-core)"/><polygon class="fl" points="330.6,758.4 694.2,758.4 694.2,758.4 703.2,758.4 703.2,484.8 654.6,484.8 654.6,319.2 364.8,319.2 364.8,625.2 330.6,679.2" fill="url(#d02-mw)"/><polygon class="fl" points="364.8,319.2 694.2,319.2 694.2,247.2 364.8,247.2" fill="url(#d02-ms)"/><polyline class="sk" points="345.0,247.2 345.0,60.0"/><polyline class="sk" points="705.0,758.4 705.0,60.0"/><polyline class="brk" points="312.6,60.0 517.8,60.0 521.4,45.6 528.6,74.4 532.2,60.0 737.4,60.0"/><polyline class="brk" points="301.8,758.4 512.4,758.4 516.0,744.0 523.2,772.8 526.8,758.4 737.4,758.4"/><polyline class="nw" points="334.2,585.6 347.9,571.2 347.9,247.2 373.8,247.2 381.0,261.6 388.2,247.2 699.6,247.2 699.6,463.2 661.8,463.2 661.8,355.2"/><polyline class="nw" points="683.4,384.0 683.4,319.2 361.2,319.2 361.2,625.2 328.8,679.2 328.8,758.4"/><polyline class="sc" points="694.2,421.2 694.2,433.2"/><polyline class="sc" points="694.2,427.2 726.6,427.2"/><polyline class="wt" points="337.1,85.2 337.1,241.8 339.2,252.6 339.2,565.8 326.3,586.3" marker-end="url(#d02-aw)"/><polyline class="wt2" points="325.6,596.4 325.6,670.2" marker-end="url(#d02-aw)"/><polyline class="wt" points="319.8,686.4 319.8,744.0" marker-end="url(#d02-aw)"/><path class="wt2" d="M273.0,654.0 Q334.2,643.2 355.4,592.8 L355.4,398.4" marker-end="url(#d02-aw)"/><polyline class="wt2" points="350.4,241.4 374.5,241.4" marker-end="url(#d02-aw)"/><text class="tw" x="331.1" y="78.0" text-anchor="end">빗물</text><polyline class="dm" points="342.0,247.2 294.2,247.2"/><polyline class="dm" points="331.2,571.2 294.2,571.2"/><polyline class="dm" points="358.2,625.2 294.2,625.2"/><polyline class="dm" points="298.2,247.2 298.2,571.2"/><polyline class="dm" points="294.7,250.7 301.7,243.7"/><polyline class="dm" points="294.7,574.7 301.7,567.7"/><text class="dx" text-anchor="middle" transform="translate(294.2 409.2) rotate(-90)">립 90</text><polyline class="dm" points="298.2,571.2 298.2,625.2"/><polyline class="dm" points="294.7,574.7 301.7,567.7"/><polyline class="dm" points="294.7,628.7 301.7,621.7"/><text class="dx" text-anchor="middle" transform="translate(294.2 598.2) rotate(-90)">15</text><polyline class="dm" points="363.0,319.2 442.6,319.2"/><polyline class="dm" points="352.2,571.2 442.6,571.2"/><polyline class="dm" points="438.6,319.2 438.6,571.2"/><polyline class="dm" points="435.1,322.7 442.1,315.7"/><polyline class="dm" points="435.1,574.7 442.1,567.7"/><text class="dx halo" text-anchor="middle" transform="translate(450.6 445.2) rotate(-90)">겹침 70</text><polyline class="dm" points="611.4,247.2 611.4,319.2"/><polyline class="dm" points="607.9,250.7 614.9,243.7"/><polyline class="dm" points="607.9,322.7 614.9,315.7"/><text class="dx halo" text-anchor="middle" transform="translate(623.4 283.2) rotate(-90)">20</text><polyline class="ld" points="345.0,132.0 256.0,128.0"/><circle class="ldd" cx="345.0" cy="132.0" r="1.8"/><text class="tx" x="250.0" y="132.0" text-anchor="end">기존 외부강판(상부)</text><text class="ts" x="250.0" y="147.0" text-anchor="end">그대로 둠 · 절단 끝 징크리치 방청</text><polyline class="ld" points="346.4,247.2 256.0,221.6"/><circle class="ldd" cx="346.4" cy="247.2" r="1.8"/><text class="tx" x="250.0" y="225.6" text-anchor="end">맞댐부</text><text class="ts" x="250.0" y="240.6" text-anchor="end">립 바깥면 = 강판 안쪽면 (0.5 mm 들어감)</text><text class="ts" x="250.0" y="255.6" text-anchor="end">물이 계단처럼 아래 판으로 넘어감</text><polyline class="ld" points="347.9,427.2 256.0,408.8"/><circle class="ldd" cx="347.9" cy="427.2" r="1.8"/><text class="tx" x="250.0" y="412.8" text-anchor="end">캡레일 물끊기 립 90</text><text class="ts" x="250.0" y="427.8" text-anchor="end">1.0t 도장강판 (기존 패널 색)</text><polyline class="ld" points="337.8,582.0 256.0,538.4"/><circle class="ldd" cx="337.8" cy="582.0" r="1.8"/><text class="tx" x="250.0" y="542.4" text-anchor="end">립 하단 킥아웃</text><text class="ts" x="250.0" y="557.4" text-anchor="end">물방울을 바깥으로 떨굼</text><polyline class="ld" points="346.8,600.0 256.0,617.6"/><circle class="ldd" cx="346.8" cy="600.0" r="1.8"/><text class="tx" x="250.0" y="621.6" text-anchor="end">들임 줄눈 15</text><text class="ts" x="250.0" y="636.6" text-anchor="end">바깥과 통하는 개구 → 등압</text><polyline class="ld" points="346.8,654.0 256.0,696.8"/><circle class="ldd" cx="346.8" cy="654.0" r="1.8"/><text class="tx" x="250.0" y="700.8" text-anchor="end">45° 조글</text><text class="ts" x="250.0" y="715.8" text-anchor="end">떨어진 물을 전면판 바깥으로</text><polyline class="ld" points="328.8,729.6 256.0,740.0"/><circle class="ldd" cx="328.8" cy="729.6" r="1.8"/><text class="tx" x="250.0" y="744.0" text-anchor="end">카세트 전면판 0.8t</text><polyline class="ld" points="525.0,132.0 746.0,113.6"/><circle class="ldd" cx="525.0" cy="132.0" r="1.8"/><text class="tx" x="752.0" y="117.6" text-anchor="start">기존 단열재(상부)</text><text class="ts" x="752.0" y="132.6" text-anchor="start">자르거나 파내지 않음</text><polyline class="ld" points="561.0,247.2 746.0,207.2"/><circle class="ldd" cx="561.0" cy="247.2" r="1.8"/><text class="tx" x="752.0" y="211.2" text-anchor="start">캡레일 상판</text><text class="ts" x="752.0" y="226.2" text-anchor="start">단열재 절단면에 밀착 (화염·빗물 차단)</text><polyline class="ld" points="381.0,259.8 746.0,272.0"/><circle class="ldd" cx="381.0" cy="259.8" r="1.8"/><text class="tx" x="752.0" y="276.0" text-anchor="start">모세관 차단 홈</text><text class="ts" x="752.0" y="291.0" text-anchor="start">맞댐부로 스민 물이 안쪽으로 못 감</text><polyline class="ld" points="561.0,283.2 746.0,336.8"/><circle class="ldd" cx="561.0" cy="283.2" r="1.8"/><text class="tx" x="752.0" y="340.8" text-anchor="start">압축 불연 스트립 30 → 20</text><polyline class="ld" points="489.0,319.2 746.0,387.2"/><circle class="ldd" cx="489.0" cy="319.2" r="1.8"/><text class="tx" x="752.0" y="391.2" text-anchor="start">텅 + 상부판 일체 절곡</text><polyline class="ld" points="681.6,376.8 746.0,437.6"/><circle class="ldd" cx="681.6" cy="376.8" r="1.8"/><text class="tx" x="752.0" y="441.6" text-anchor="start">테일이 걸이 채널에 걸림 8</text><polyline class="ld" points="705.0,427.2 746.0,488.0"/><circle class="ldd" cx="705.0" cy="427.2" r="1.8"/><text class="tx" x="752.0" y="492.0" text-anchor="start">캡레일 피스 @150 → 내부강판</text><polyline class="ld" points="361.2,477.6 746.0,549.2"/><circle class="ldd" cx="361.2" cy="477.6" r="1.8"/><text class="tx" x="752.0" y="553.2" text-anchor="start">텅: 립 뒤로 겹침 70</text><text class="ts" x="752.0" y="568.2" text-anchor="start">틈 3 등압 공간 → 물이 못 올라감</text><polyline class="ld" points="525.0,661.2 746.0,657.2"/><circle class="ldd" cx="525.0" cy="661.2" r="1.8"/><text class="tx" x="752.0" y="661.2" text-anchor="start">미네랄울 2호 이상 (t + 10 압축)</text><polyline class="ld" points="705.0,722.4 746.0,718.4"/><circle class="ldd" cx="705.0" cy="722.4" r="1.8"/><text class="tx" x="752.0" y="722.4" text-anchor="start">기존 내부강판</text><text class="ts" x="301.8" y="30.0" text-anchor="end">실외</text><text class="ts" x="733.8" y="30.0" text-anchor="start">실내</text></svg>