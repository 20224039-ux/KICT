ss="ld" points="422.4,254.4 764.0,344.0"/><circle class="ldd" cx="422.4" cy="254.4" r="1.8"/><text class="tx" x="770.0" y="348.0" text-anchor="start">레일 리브 12 + 배수 노치 @150</text><polyline class="ld" points="445.8,272.4 764.0,394.4"/><circle class="ldd" cx="445.8" cy="272.4" r="1.8"/><text class="tx" x="770.0" y="398.4" text-anchor="start">하향 리브: 레일 리브 뒤에 걸림 8</text><text class="ts" x="301.8" y="30.0" text-anchor="end">실외</text><text class="ts" x="733.8" y="30.0" text-anchor="start">실내</text></svg>